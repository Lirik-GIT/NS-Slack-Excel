display_information:
  name: NS Estimator
  description: NetSuite ROM estimates from Lirik's estimator workbook
  background_color: "#0a2540"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: NS Estimator
    always_online: true
  slash_commands:
    - command: /ns-estimate
      description: Get a NetSuite ROM estimate
      usage_hint: "[optional: paste the requirement]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - files:read
      - files:write
      - channels:history
      - groups:history
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
